name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.14.0'

      - name: Validate tag and commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.js --tag "$TAG"
          git fetch origin main
          HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          MAIN_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Tag ${TAG} does not resolve to the checked-out HEAD commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" "$MAIN_SHA"; then
            echo "Tag ${TAG} does not point to a commit contained in origin/main." >&2
            exit 1
          fi

  goreleaser:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean --skip=publish

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          cp dist/*.tar.gz dist/*.zip dist/checksums.txt release-assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets-${{ github.run_id }}
          path: release-assets/
          if-no-files-found: error
          overwrite: true

  verify-release-assets:
    needs: [preflight, goreleaser]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.run_id }}
          path: release-assets

      - name: Verify release assets
        run: node scripts/verify-release-assets.js release-assets

  publish-release:
    needs: verify-release-assets
    runs-on: ubuntu-22.04
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - name: Download verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-assets-${{ github.run_id }}
          path: release-assets

      - name: Validate package and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.js --tag "$TAG"
          node scripts/verify-release-assets.js release-assets
          cp release-assets/checksums.txt checksums.txt

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/verify-release-assets.js release-assets

          RELEASE_JSON="${RUNNER_TEMP}/release.json"
          RELEASE_ERROR="${RUNNER_TEMP}/release-error.txt"
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$RELEASE_JSON" 2> "$RELEASE_ERROR"
          API_STATUS=$?
          set -e

          if [[ "$API_STATUS" -ne 0 ]]; then
            if grep -q 'HTTP 404' "$RELEASE_ERROR"; then
              gh release create "$TAG" release-assets/* --verify-tag --title "$TAG" --generate-notes
            else
              cat "$RELEASE_ERROR" >&2
              exit "$API_STATUS"
            fi
          else
            RELEASE_STATE="$(node -e 'const r=require(process.argv[1]); if(typeof r.draft!=="'"'boolean"'"'||typeof r.prerelease!=="'"'boolean"'"') process.exit(2); process.stdout.write(`${r.draft}:${r.prerelease}`)' "$RELEASE_JSON")"
            if [[ "$RELEASE_STATE" != "false:false" ]]; then
              echo "An existing Draft or prerelease GitHub Release for ${TAG} is not trusted; remove it and rerun." >&2
              exit 1
            fi
          fi

          mkdir published-assets
          gh release download "$TAG" --dir published-assets
          node scripts/verify-release-assets.js published-assets
          diff -qr release-assets published-assets

      - name: Pack and publish idempotently
        run: |
          set -euo pipefail
          PACK_JSON="${RUNNER_TEMP}/npm-pack.json"
          npm pack --json > "$PACK_JSON"
          TARBALL="$(node -e 'const p=require(process.argv[1]); if(!Array.isArray(p)||p.length!==1||typeof p[0].filename!=="'"'string"'"') process.exit(2); process.stdout.write(p[0].filename)' "$PACK_JSON")"
          LOCAL_INTEGRITY="$(node -e 'const p=require(process.argv[1]); if(!Array.isArray(p)||p.length!==1||typeof p[0].integrity!=="'"'string"'"') process.exit(2); process.stdout.write(p[0].integrity)' "$PACK_JSON")"
          test -f "$TARBALL" || { echo "npm pack did not create ${TARBALL}." >&2; exit 1; }

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          REMOTE_JSON="${RUNNER_TEMP}/npm-view.json"
          REMOTE_ERROR="${RUNNER_TEMP}/npm-view-error.txt"
          set +e
          npm view "${PACKAGE_NAME}@${VERSION}" dist.integrity --json --registry=https://registry.npmjs.org > "$REMOTE_JSON" 2> "$REMOTE_ERROR"
          VIEW_STATUS=$?
          set -e

          if [[ "$VIEW_STATUS" -eq 0 ]]; then
            REMOTE_INTEGRITY="$(node -e 'const v=require(process.argv[1]); if(typeof v!=="'"'string"'"') process.exit(2); process.stdout.write(v)' "$REMOTE_JSON")"
            if [[ "$REMOTE_INTEGRITY" != "$LOCAL_INTEGRITY" ]]; then
              echo "npm ${PACKAGE_NAME}@${VERSION} already exists with different integrity." >&2
              exit 1
            fi
            echo "npm ${PACKAGE_NAME}@${VERSION} already has matching integrity; skipping publish."
          elif grep -q 'E404' "$REMOTE_ERROR"; then
            npm publish "$TARBALL" --access public
          else
            cat "$REMOTE_ERROR" >&2
            exit "$VIEW_STATUS"
          fi
