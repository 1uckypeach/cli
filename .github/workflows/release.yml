name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'

      - name: Validate tag and commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/release-preflight.js --tag "$TAG"
          git fetch origin main
          HEAD_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          MAIN_SHA="$(git rev-parse --verify 'FETCH_HEAD^{commit}')"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Tag ${TAG} does not resolve to the checked-out HEAD commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$HEAD_SHA" "$MAIN_SHA"; then
            echo "Tag ${TAG} does not point to a commit contained in origin/main." >&2
            exit 1
          fi

  publish-release:
    needs: preflight
    runs-on: ubuntu-22.04
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.23'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pinned npm
        run: npm install --global npm@11.16.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Include release checksums
        run: |
          set -euo pipefail
          test -s dist/checksums.txt
          cp dist/checksums.txt checksums.txt

      - name: Publish to npm
        run: npm publish --access public
